<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto | Cyber Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">/root@analyst:~$</div>
            <ul>
                <li><a href="index.html">← Volver</a></li>
            </ul>
        </nav>
    </header>

    <main id="proyecto-container">
        <p>Cargando proyecto...</p>
    </main>

    <script>
        // 1. Obtener el ID de la URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const container = document.getElementById('proyecto-container');

        if (!id) {
            container.innerHTML = '<p>No se especificó ningún proyecto.</p>';
        } else {
            // 2. Cargar el JSON
            fetch('json/proyecto.json')
                .then(res => res.json())
                .then(data => {
                    const proyecto = data[id];
                    if (!proyecto) {
                        container.innerHTML = '<p>Proyecto no encontrado.</p>';
                        return;
                    }
                    // 3. Renderizar el proyecto
                    container.innerHTML = `
                        <h1>${proyecto.titulo}</h1>
                        <p class="meta">
                            ${proyecto.tipo} · ${proyecto.fecha}
                        </p>
                        <div class="tags">
                            ${proyecto.tags.map(t => `<span>${t}</span>`).join('')}
                        </div>
                        <article class="proyecto-content">
                            ${proyecto.contenido}
                        </article>
                    `;
                    document.title = proyecto.titulo + ' | Cyber Portfolio';
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<p>Error cargando el proyecto.</p>';
                });
        }
    </script>

</body>
</html>
