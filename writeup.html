<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeup | Cyber Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">/root@analyst:~$</div>
            <ul>
                <li><a href="index.html">← Volver</a></li>
            </ul>
        </nav>
    </header>

    <main id="writeup-container">
        <p>Cargando writeup...</p>
    </main>

    <script>
        // 1. Obtener el ID de la URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const container = document.getElementById('writeup-container');

        if (!id) {
            container.innerHTML = '<p>No se especificó ningún writeup.</p>';
        } else {
            // 2. Cargar el JSON
            fetch('data/writeups.json')
                .then(res => res.json())
                .then(data => {
                    const writeup = data[id];
                    if (!writeup) {
                        container.innerHTML = '<p>Writeup no encontrado.</p>';
                        return;
                    }
                    // 3. Renderizar el writeup
                    container.innerHTML = `
                        <h1>${writeup.titulo}</h1>
                        <p class="meta">
                            ${writeup.plataforma} · ${writeup.fecha} · Dificultad: ${writeup.dificultad}
                        </p>
                        <div class="tags">
                            ${writeup.tags.map(t => `<span>${t}</span>`).join('')}
                        </div>
                        <article class="writeup-content">
                            ${writeup.contenido}
                        </article>
                    `;
                    document.title = writeup.titulo + ' | Cyber Portfolio';
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<p>Error cargando el writeup.</p>';
                });
        }
    </script>

</body>
</html>
